branches:
  only:
    - develop
    - staging
if: head_branch !~ ^dependabot/
dist: jammy
language: node_js
node_js:
  - 18
before_install:
  - node scripts/hack-travis.mjs
install:
  - npm ci
  - npm run prepare
script:
  - npm run lint
  - npx tsc
  # The five documentation gates, which are read-only and take seconds
  # between them. `npm run prepare` above regenerates the committed
  # artifacts, so without this nothing anywhere notices a stale
  # `commands.json` — and that file is the table the CLI parses argv against.
  - npm run docs:api:gates
  - npm run test:cli:node-safe
  - npm test
  - npm run test:cli:offline
