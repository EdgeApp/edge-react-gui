branches:
  only:
    - develop
    - staging
if: head_branch !~ ^dependabot/
dist: jammy
language: node_js
node_js:
  - 18
before_install:
  - node scripts/hack-travis.mjs
install:
  - npm ci
  - npm run prepare
script:
  - npm run lint
  - npx tsc
  # The five documentation gates, which are read-only and take seconds
  # between them. `npm run prepare` above regenerates the committed
  # artifacts, so without this nothing anywhere notices a stale
  # `commands.json` — and that file is the table the CLI parses argv against.
  - npm run docs:api:gates
  # Not regenerated by `npm run prepare` above, so unlike the gates above this
  # one does fail on a stale committed artifact: the published CLI's
  # dependency list is derived from the module graph, and a new import that
  # did not reach the manifest is an `npm install` that succeeds and a CLI
  # that cannot resolve a module.
  - npm run cli:manifest:check
  - npm run test:cli:node-safe
  - npm test
  - npm run test:cli:offline
