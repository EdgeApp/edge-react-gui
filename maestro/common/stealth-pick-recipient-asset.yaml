# Changes which asset the recipient receives, without choosing an address.
#
# env DEST_CHAIN  the destination chain's Edge pluginId, e.g. "ethereum",
#                 "litecoin", "ripple". The picker keys its rows on the asset
#                 rather than on a display name, because a token can share both
#                 its name and its code with a chain (the POL ERC-20 and
#                 Polygon).
appId: ${APP_ID}
env:
  APP_ID: ${MAESTRO_APP_ID || 'co.edgesecure.app'}
---
- tapOn: 'Recipient receives'
- waitForAnimationToEnd:
    timeout: 2500
# The list holds every served chain, so most of it is below the fold and the
# row has to be scrolled to before it can be tapped. The search box above it is
# the faster path by hand, but the row id is stable either way.
- scrollUntilVisible:
    element:
      id: 'radioListItem_${DEST_CHAIN}'
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: 'radioListItem_${DEST_CHAIN}'
- waitForAnimationToEnd:
    timeout: 2500
