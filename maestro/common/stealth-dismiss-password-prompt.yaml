# Closes the "Verify your password" prompt if it is up.
#
# The prompt covers the scene, so nothing under it is reachable until it
# closes. Closing postpones the check without touching the password, and the
# walk carries on signed in with the PIN alone.
appId: ${APP_ID}
env:
  APP_ID: ${MAESTRO_APP_ID || 'co.edgesecure.app'}
---
- runFlow:
    when:
      visible: 'Verify your password'
    commands:
      - tapOn:
          id: 'modal-close-button'
      - waitForAnimationToEnd:
          timeout: 2500
