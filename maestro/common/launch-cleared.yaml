# Launches the app with a cleared cache, and waits for the Edge logo to appear.
appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
- tapOn:
    id: "modal-close-button"
    optional: true
- tapOn:
    point: "93%,60%"
    optional: true
- extendedWaitUntil:
    visible: 'Welcome to\nFinancial Freedom'
    timeout: 30000
- assertNotVisible: 'Oops!'
