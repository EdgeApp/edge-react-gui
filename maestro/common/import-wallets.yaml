# Imports wallets by name

appId: ${MAESTRO_APP_ID}
env:
    ASSET_NAMES: ${ASSET_NAMES || ""}
    SEED_PHRASE: ${SEED_PHRASE || MAESTRO_EDGE_MAX_IMPORT_SEED}
    PIRATE_BDAY: ${PIRATE_BDAY || ""}
    ZCASH_BDAY: ${ZCASH_BDAY || ""}
---
# Parse env so we can accept a string or array input
- evalScript: ${if (ASSET_NAMES.startsWith('[')) output.ASSET_NAMES = JSON.parse(ASSET_NAMES); else output.ASSET_NAMES = [ASSET_NAMES]}

# Open add wallet screen
- tapOn: Assets
- tapOn:
    id: "addButton"
- tapOn: Search Wallets

# Loop over wallet names and import them
- evalScript: ${output.index = 0}
- repeat:
    times: ${output.ASSET_NAMES.length}
    commands:
      - evalScript: ${output.assetName = output.ASSET_NAMES[output.index]}
      - tapOn:
          id: "undefined.clearIcon"
      - inputText: ${output.assetName}
      
      # Escape parentheses for regex matching - "Bitcoin (no Segwit)" breaks flow otherwise
      - evalScript: ${output.assetName = output.assetName.replace(/\(/g, '\\(').replace(/\)/g, '\\)')}
      - tapOn:
          text: ${".*" + output.assetName}
          index: 1 # First index is the search bar
      - evalScript: ${output.index++}

- tapOn: Next
- tapOn: Import Wallets

- tapOn: Private Key or Private Seed
- inputText: ${SEED_PHRASE}

# Drop keyboard - Android
- runFlow:
    when:
      platform: Android
    commands:
        - hideKeyboard
        - tapOn: "Enter your.*"
# Drop keyboard - iOS
# Do not press Enter/Return: seed field is multiline, returnKeyType=none,
# blurOnSubmit=false. Tapping the field label also fails to dismiss. Tap the
# non-interactive instruction paragraph (Maestro iOS keyboard workaround).
- runFlow:
    when:
      platform: iOS
    commands:
        - tapOn:
            text: "^Enter your private seed, private key, or active key to verify and restore the associated wallet$"

- tapOn: Next

# # Sometimes android requires additional tap
# - runFlow:
#     when:
#       visible: Import Wallet
#     commands:
#       - tapOn: Next

# Add birthday height for Zcash and Pirate Chain
# Index for targetting the correct "edit" icon 
- evalScript: ${output.index = 0}
# Pirate Chain on top if both are displayed
- runFlow:
    when:
      true: ${PIRATE_BDAY}
    commands:
      - tapOn: 
          text: ""
          index: ${output.index}
      - inputText: ${PIRATE_BDAY}
      - tapOn: Submit
      - evalScript: ${output.index++}
# Zcash birthday
- runFlow:
    when:
      true: ${ZCASH_BDAY}
    commands:
      - tapOn: 
          text: ""
          index: ${output.index}
      - inputText: ${ZCASH_BDAY}
      - tapOn: Submit
      - evalScript: ${output.index++}


# Complete the import unless the caller intentionally stops early
# to test the auto-detected-token notification.
- runFlow:
    when:
      true: ${!NO_COMPLETE}
    commands:
      # Bound retries so a stuck Next button cannot hang the suite.
      - repeat:
          times: 10
          while:
            visible: Next
          commands:
            - tapOn:
                text: Next
                optional: true

      # A bounded repeat can exhaust successfully, so verify completion.
      - assertNotVisible: Next
