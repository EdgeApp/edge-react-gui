# Priority: Critical
# Test ID: C190284
# Title: Login from Edgy WiFi into an account created with 2FA enabled- Blocked 2FA
# Expected Result:
#   1. User is blocked and prevented from being able to login due to 2FA
#   2. Entering backup code correctly logs in
#   3. Able to see assets after logging in

appId: ${MAESTRO_APP_ID}
tags:
- all
- C190284
---
- runFlow:
    file: ../common/launch-cleared.yaml
- runFlow:
    file: ../common/login-password.yaml
    env:
      USERNAME: ${MAESTRO_EDGE_2FA_USERNAME}
      PASSWORD: ${MAESTRO_EDGE_2FA_PASSWORD}

- extendedWaitUntil:
    visible: "Username and password are correct. This device cannot log in because\
    \ it does not have the right 2-factor code."
    timeout: 15000
- assertVisible: "Enter 2FA code"
- tapOn: "Enter 2FA code"
- inputText: ${MAESTRO_EDGE_2FA_BACKUP_CODE}
- assertVisible: "Submit"

# Workaround for keyboard autocomplete suggestion conflicts on some android screensizes
- hideKeyboard:
    optional: true

- tapOn:
    text: "Submit"
    optional: true

# Wait for the delayed request-notifications modal, then verify it is gone.
- extendedWaitUntil:
    visible:
      id: "modal-close-button"
    timeout: 30000
    optional: true
- tapOn:
    id: "modal-close-button"
    optional: true
- extendedWaitUntil:
    notVisible:
      id: "modal-close-button"
    timeout: 10000
    optional: true

# Wait for the security-alert scene before checking its available actions.
- extendedWaitUntil:
    visible:
      id: "securityAlertDenyButton"
    timeout: 30000
    optional: true

# A second request-notifications modal can be queued over the alert scene.
- extendedWaitUntil:
    visible:
      id: "modal-close-button"
    timeout: 10000
    optional: true
- tapOn:
    id: "modal-close-button"
    optional: true
- extendedWaitUntil:
    notVisible:
      id: "modal-close-button"
    timeout: 10000
    optional: true

# Prefer Deny All when it is exposed. The zero settle timeout lets Maestro
# observe the loading-state identifier before waiting for it to disappear.
- runFlow:
    when:
      visible:
        id: "securityAlertDenyAllButton"
    commands:
      - tapOn:
          id: "securityAlertDenyAllButton"
          waitToSettleTimeoutMs: 0
      - extendedWaitUntil:
          visible:
            id: "securityAlertDenyAllButton.spinner"
          timeout: 5000
      - extendedWaitUntil:
          notVisible:
            id: "securityAlertDenyAllButton.spinner"
          timeout: 20000
      - extendedWaitUntil:
          notVisible:
            id: "securityAlertDenyAllButton"
          timeout: 20000

# Android does not expose the off-screen Deny All footer. Clear any remaining
# vouchers individually, bounded to avoid an unending cleanup loop.
- runFlow:
    when:
      visible:
        id: "securityAlertDenyButton"
    commands:
      - repeat:
          times: 10
          commands:
            - runFlow:
                when:
                  visible:
                    id: "securityAlertDenyButton"
                commands:
                  - runFlow:
                      when:
                        visible:
                          id: "modal-close-button"
                      commands:
                        - tapOn:
                            id: "modal-close-button"
                        - extendedWaitUntil:
                            notVisible:
                              id: "modal-close-button"
                            timeout: 10000
                  - tapOn:
                      id: "securityAlertDenyButton"
                      waitToSettleTimeoutMs: 0
                  - extendedWaitUntil:
                      visible:
                        id: "securityAlertDenyButton.spinner"
                      timeout: 5000
                  - extendedWaitUntil:
                      notVisible:
                        id: "securityAlertDenyButton.spinner"
                      timeout: 20000
      - extendedWaitUntil:
          notVisible:
            id: "securityAlertDenyButton"
          timeout: 20000
- tapOn:
    text: "SKIP"
    optional: true
- tapOn:
    text: "SKIP"
    optional: true

# Dismiss any notification prompt queued after the denial actions.
- extendedWaitUntil:
    visible:
      id: "modal-close-button"
    timeout: 10000
    optional: true
- tapOn:
    id: "modal-close-button"
    optional: true
- extendedWaitUntil:
    notVisible:
      id: "modal-close-button"
    timeout: 10000
    optional: true

# If the survey modal shows, dismiss it
- extendedWaitUntil:
    visible: "How Did You Discover Edge?"
    timeout: 20000
    optional: true
- tapOn:
    text: "Dismiss"
    optional: true

- assertVisible: "Assets"
- tapOn: "Assets"
- assertVisible: "Wallets"

- stopApp
