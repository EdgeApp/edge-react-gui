# Houdini incognito-send prototype walk — Proposal A (From -> To grouping).
#
# Logs into the funded test account, opens the Bitcoin wallet, taps Send (the
# wallet Send button is routed to the prototype scene), and walks every branch
# of the flow, capturing the review screenshots. Nothing here talks to Houdini;
# every value is hard-coded by HoudiniSendScene.
#
# Screenshots captured (under ~/.maestro/tests/<run>/ ):
#   houdini-a-01-plain-initial    same-asset, non-incognito start: standard
#                                 "add recipient address" affordance, no quote
#                                 tile, no estimated "recipient gets" row
#   houdini-a-02-incognito        same-asset incognito on: toggle tile expands
#                                 with messaging, "recipient gets" shows the
#                                 conversion percent, address locks
#   houdini-a-03-swap-xmr         cross-asset XMR: conversion percent (-2.5%) and
#                                 the conditional Destination Tag row
#   houdini-a-04-swap-success     cross-asset success (SwapSuccessScene)
#   houdini-a-05-success-modal    same-asset, non-incognito success (Transaction
#                                 Success modal)
#   houdini-a-06-tx-details       same-asset success continues to Transaction
#                                 Details for the prototype transaction
appId: ${APP_ID}
env:
  APP_ID: co.edgesecure.app
  PIN_DIGIT: '0'
tags:
  - houdini
---
- launchApp
- runFlow:
    when:
      visible: 'Exit PIN'
    commands:
      - tapOn: { text: '${PIN_DIGIT}', waitToSettleTimeoutMs: 900 }
      - tapOn: { text: '${PIN_DIGIT}', waitToSettleTimeoutMs: 900 }
      - tapOn: { text: '${PIN_DIGIT}', waitToSettleTimeoutMs: 900 }
      - tapOn: { text: '${PIN_DIGIT}', waitToSettleTimeoutMs: 1500 }
- runFlow:
    when:
      visible: 'Security is Our Priority'
    commands:
      - tapOn: 'Cancel'
- runFlow:
    when:
      visible: 'How Did You Discover Edge?'
    commands:
      - tapOn: 'Dismiss'
- runFlow:
    when:
      visible: 'Claim Your Web3 Handle'
    commands:
      - tapOn: 'Not Now'

# Open the Bitcoin wallet, then Send (routed to the prototype scene). Gate on
# the wallet tx-list scene (its "Receive" button) so Send cannot misfire on the
# home balance-card Send button (which would open the production send flow).
- tapOn: 'Assets'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: 'My Bitcoin'
- assertVisible: 'Receive'
- tapOn: 'Send'
- waitForAnimationToEnd:
    timeout: 3000

# Same-asset, non-incognito start: the initial "add recipient address" state.
# No quote tile and no estimated "recipient gets" row exist yet.
- assertVisible: 'Incognito send'
- assertVisible: 'Send to Address'
- takeScreenshot: houdini-a-01-plain-initial

# Turn incognito on: the toggle tile expands with messaging, the estimated
# "recipient gets" row appears with a conversion percent, address locks.
- tapOn: 'Incognito send'
- assertVisible: 'Incognito routes your send.*'
- assertVisible: 'Recipient gets'
- takeScreenshot: houdini-a-02-incognito

# Back to non-incognito, then pick a mismatching recipient asset (XMR). The
# asset mismatch alone routes through Houdini (conversion percent + locked
# address + destination tag).
- tapOn: 'Incognito send'
- tapOn: 'Recipient receives'
- tapOn:
    text: 'XMR Monero.*'
- assertVisible: 'Destination Tag'
- scrollUntilVisible:
    element:
      text: 'Slide to send.*'
    direction: DOWN
- takeScreenshot: houdini-a-03-swap-xmr

# Slide -> SwapSuccessScene (cross-asset completion path).
- swipe:
    start: 77%, 88%
    end: 18%, 88%
    duration: 1800
- assertVisible: 'Congratulations!'
- takeScreenshot: houdini-a-04-swap-success
- tapOn: 'Done'
- waitForAnimationToEnd:
    timeout: 2500

# Same-asset, non-incognito success path: re-enter a fresh send and slide.
- tapOn: 'Assets'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: 'My Bitcoin'
- assertVisible: 'Receive'
- tapOn: 'Send'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: 'Send to Address'
- swipe:
    start: 77%, 88%
    end: 18%, 88%
    duration: 1800
- assertVisible: 'Transaction Success'
- takeScreenshot: houdini-a-05-success-modal

# Acknowledge -> Transaction Details for the prototype transaction.
- tapOn: 'OK'
- assertVisible: 'Transaction ID'
- takeScreenshot: houdini-a-06-tx-details
