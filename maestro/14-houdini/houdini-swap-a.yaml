# Houdini incognito-swap prototype walk — Proposal A.
#
# Opens the Bitcoin wallet, taps Trade -> "Swap BTC to/from another crypto" (the
# wallet swap action is routed to the prototype HoudiniSwapScene), enters
# amounts with the incognito toggle in a card, then gets a mock quote
# ("Powered by Houdini", no chevron). Nothing talks to Houdini.
#
# Screenshots captured (under ~/.maestro/tests/<run>/ ):
#   houdini-swap-01-entry        from/to amount entry, incognito toggle in a card
#   houdini-swap-02-incognito    incognito on: toggle card expands with messaging
#   houdini-swap-03-quote        mock quote scene, "Powered by Houdini" (no chevron)
appId: ${APP_ID}
env:
  APP_ID: co.edgesecure.app
  PIN_DIGIT: '0'
tags:
  - houdini
---
- launchApp
- runFlow:
    when:
      visible: 'Exit PIN'
    commands:
      - tapOn: { text: '${PIN_DIGIT}', waitToSettleTimeoutMs: 900 }
      - tapOn: { text: '${PIN_DIGIT}', waitToSettleTimeoutMs: 900 }
      - tapOn: { text: '${PIN_DIGIT}', waitToSettleTimeoutMs: 900 }
      - tapOn: { text: '${PIN_DIGIT}', waitToSettleTimeoutMs: 1500 }
- tapOn:
    text: '.*Horizon.*'
    optional: true

# Open the Bitcoin wallet, then Trade -> Swap (routed to the prototype scene).
- tapOn: 'Assets'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: 'My Bitcoin'
- assertVisible: 'Receive'
- tapOn: 'Trade'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: 'Swap BTC to/from another crypto'
- waitForAnimationToEnd:
    timeout: 3000

# Swap amount entry, incognito toggle in a card.
- assertVisible: 'You send'
- assertVisible: 'You receive'
- assertVisible: 'Incognito send'
- takeScreenshot: houdini-swap-01-entry

# Incognito on: the toggle card expands with messaging.
- tapOn: 'Incognito send'
- assertVisible: 'Incognito routes your send.*'
- takeScreenshot: houdini-swap-02-incognito

# Slide to get the mock quote -> "Powered by Houdini" (no chevron).
- scrollUntilVisible:
    element:
      text: 'Slide to get quote'
    direction: DOWN
- swipe:
    start: 77%, 80%
    end: 16%, 80%
    duration: 1900
- assertVisible: 'Powered by Houdini'
- takeScreenshot: houdini-swap-03-quote
